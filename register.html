<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
</head>
<body>
    



























    <script>
        const btnUser = document.getElementById("btn-user");
        const menuUser = document.getElementById("user-menu");
        
        // click vào icon
        btnUser.addEventListener("click", function (e) {
            e.stopPropagation(); // tránh bị đóng ngay
            menuUser.classList.toggle("show");
        });
        
        // click ra ngoài -> đóng menu
        document.addEventListener("click", function () {
            menuUser.classList.remove("show");
        });
        
        // click trong menu không bị đóng
        menuUser.addEventListener("click", function (e) {
            e.stopPropagation();
        });
        </script>
</body>
</html>
